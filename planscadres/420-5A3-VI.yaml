cible_formation: >-
  À la fin du cours, l'élève sera en mesure d'effectuer une veille
  technologique pour recommander des composantes matérielles et
  logicielles.

notes_preliminaires: >-
  Le cours 420-5A3-VI : Technologies émergentes fait partie de la formation
  menant au diplôme d'études collégiales (DEC) dans le programme 420.B0 :
  Techniques de l'informatique.


  Il est offert en 5e session.


  Plusieurs compétences sont touchées par ce cours.


  La compétence 0000 : Traiter l'information relative aux réalités du
  milieu du travail en informatique est vue partiellement.


  Son acquisition a débuté dans le cours 420-1C4-VI : Outils informatiques
  à la 1re session.


  Son acquisition sera complétée dans le cours 420-6C3-VI : Projet
  personnel à la 6e session.


  Ce cours vise l'atteinte complète de la compétence 00SF : Évaluer des
  composants logiciels et matériels.


  La compétence 00SH : S'adapter à des technologies informatiques est vue
  partiellement.


  Son acquisition sera complétée dans le cours 420-6C3-VI : Projet
  personnel à la 6e session.

epreuve_finale:
  ponderation: "70 %"
  performance_finale_exigee: >-
    L'épreuve finale est composée de deux parties.


    1. Un rapport de recherche, entamé à la 5e semaine de cours et qui
    s'étend sur toute la session. L'élève produira un travail écrit d'une
    quinzaine de pages couvrant : le plan de développement d'un prototype
    fonctionnel lié à la technologie choisie; les concepts explorés et
    leur utilisation; la modélisation du prototype; la comparaison avec la
    ou les autres technologies similaires; la justification du choix de
    technologie; des informations entourant le métier de technicien.ne en
    informatique utilisant la technologie; les sources d'information; le
    journal hebdomadaire de recherche.


    2. L'élève produira également le prototype fonctionnel décrit dans le
    rapport de recherche. Cette preuve de concept sera déposée avec le
    rapport, à la fin de la session.
  contexte_realisation: >-
    Individuellement. À partir du cahier de charge fonctionnel. À partir
    d'une technologie spécifique. Le développement du travail se déroulera
    sur toute la session pendant du temps en classe et hors classe. Le
    travail est remis et présenté à la semaine 15.
  criteres_evaluation:
    - "Travail de recherche :"
    - Analyse juste du cahier des charges fonctionnel
    - Relevé complet des exigences techniques du projet
    - Inventaire précis des composantes logicielles et matérielles disponibles
    - Analyse juste des caractéristiques des composantes logicielles et matérielles
    - Recherche efficace de sources d'information
    - Analyse juste de l'information recueillie
    - Choix approprié des sources d'information
    - "Prototype :"
    - Pertinence des avis sur la compatibilité des composants
    - Pertinence des avis sur la longévité, la stabilité, l'efficacité et la maintenabilité des composants

demarche_pedagogique_suggeree: >-
  Évaluation formative des acquis en milieu de travail pour les élèves
  ayant eu un stage, les stages étant optionnels. Courtes périodes
  d'enseignement théorique suivies d'application au fur et à mesure à
  l'aide d'exercices formatifs. Des références de sites Web seront
  fournies par le professeur. L'élève devra enrichir ces sources
  d'information par ses propres recherches. Des activités seront proposées
  pour favoriser la coopération entre les élèves, l'échange des
  connaissances et la prise en charge de son apprentissage par l'élève.
  Certaines évaluations formatives peuvent être auto-corrigées par l'élève
  ou encore co-corrigées par un collègue de la classe. Bien que certains
  travaux ne fassent pas l'objet d'évaluation sommative, les élèves doivent
  absolument les compléter afin d'être prêts pour l'épreuve finale. La
  présentation du rapport de stage, par les étudiants en ayant eu un, est
  une activité essentielle à l'acquisition de la compétence d'analyse
  d'information sur la profession de technicienne et technicien en
  informatique.

