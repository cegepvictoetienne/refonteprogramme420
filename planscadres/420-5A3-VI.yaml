elements_competence:
  - code: "0000-3"
    titre: "Analyser l'information sur la profession de technicienne et technicien en informatique"
    duree_heures: 6
    habiletes:
      - "1 - Examiner les tâches et les responsabilités liées à la profession"
      - "2 - Distinguer les connaissances, des comportements, des attitudes et des habiletés nécessaires à l'exercice de la profession"
      - "3 - Distinguer les limites d'intervention propres à la profession"
    criteres_performance:
      - "1 - Examen détaillé des tâches et des responsabilités liées à la profession"
      - "2 - Distinction juste des connaissances, des comportements, des attitudes et des habiletés nécessaires à l'exercice de la profession"
      - "3 - Distinction juste des limites d'intervention propres à la profession"
    contenu_essentiel: >-
      Tâches et responsabilités liées à la profession; connaissances,
      comportements, attitudes et habiletés nécessaires à l'exercice de la
      profession; limites d'intervention professionnelle
  - code: 00SF-1
    titre: "Cerner les exigences techniques d'un projet de développement ou de déploiement"
    duree_heures: 6
    habiletes:
      - "1 - Analyser le cahier des charges fonctionnel"
      - "2 - Analyser l'architecture logicielle et de l'architecture du réseau informatique"
      - "3 - Faire le relevé des exigences techniques du projet"
    criteres_performance:
      - "1 - Analyse juste du cahier des charges fonctionnel"
      - "2 - Analyse juste de l'architecture logicielle et de l'architecture du réseau informatique"
      - "3 - Relevé complet des exigences techniques du projet"
    contenu_essentiel: >-
      Cahier de charges fonctionnel; architectures des systèmes; exigences
      techniques (besoins matériels, besoins documentaires, besoins
      applicatifs)
  - code: 00SF-2
    titre: "Rechercher des composants logiciels et matériels"
    duree_heures: 6
    habiletes:
      - "1 - Choisir les sources d'information"
      - "2 - Faire l'inventaire des composants logiciels et matériels disponibles"
    criteres_performance:
      - "1 - Choix approprié des sources d'information"
      - "2 - Inventaire précis des composants logiciels et matériels disponibles"
    contenu_essentiel: >-
      Sources d'information (sites spécialisés de programmation et de
      composantes, sections spécifiques à la technologie des médias
      traditionnels et sociaux); documentation officielle des composants
      logiciels et matériels
  - code: 00SF-3
    titre: "Formuler des avis sur les composants logiciels et matériels"
    duree_heures: 15
    habiletes:
      - "1 - Analyser les caractéristiques des plateformes, des applications et des outils de développement"
      - "2 - Analyser les caractéristiques des ordinateurs, des dispositifs d'interconnexion et des périphériques"
      - "3 - Analyser les caractéristiques des protocoles de communication filaires et sans fil"
      - "4 - Évaluer la pertinence des avis sur la compatibilité des composants"
      - "5 - Évaluer la pertinence des avis sur la longévité, la stabilité, l'efficacité et la maintenabilité des composants"
    criteres_performance:
      - "1 - Analyse juste des caractéristiques des plateformes, des applications et des outils de développement"
      - "2 - Analyse juste des caractéristiques des ordinateurs, des dispositifs d'interconnexion et des périphériques"
      - "3 - Analyse juste des caractéristiques des protocoles de communication filaires et sans fil"
      - "4 - Pertinence des avis sur la compatibilité des composants"
      - "5 - Pertinence des avis sur la longévité, la stabilité, l'efficacité et la maintenabilité des composants"
    contenu_essentiel: >-
      Critères de sélection des composantes (matérielles, logicielles);
      matrice de décision; prototype et preuve de concept
  - code: 00SH-1
    titre: "Effectuer une veille technologique"
    duree_heures: 12
    habiletes:
      - "1 - Rechercher les sources d'information"
      - "2 - Utiliser les outils de veille"
      - "3 - Analyser l'information recueillie"
      - "4 - Déterminer les technologies à expérimenter"
    criteres_performance:
      - "1 - Recherche efficace de sources d'information"
      - "2 - Utilisation appropriée des outils de veille"
      - "3 - Analyse juste de l'information recueillie"
      - "4 - Détermination judicieuse des technologies à expérimenter"
    contenu_essentiel: >-
      Méthodologie de recherche et d'intégration de l'information; outils
      de veille (automatisation de la cueillette d'information); techniques
      d'analyse de l'information (données qualitatives vs données
      quantitatives, principe de l'entonnoir); outils d'aide au choix
      technologique (grille comparative des propriétés et des
      fonctionnalités des composantes, matrice d'Eisenhower)
