elements_competence:
  - code: 00SE-1
    titre: "Établir des relations professionnelles avec des utilisatrices ou utilisateurs, des clientes ou clients, ainsi que des employeurs"
    duree_heures: 22
    habiletes:
      - "1- Développer une connaissance de soi qui permet d'établir et d'entretenir des relations interpersonnelles harmonieuses."
      - "2- Utiliser les habiletés de communication pertinentes, selon diverses situations de travail."
      - "3- Interagir avec un client, fictif ou réel, afin de s'assurer de sa satisfaction."
      - "4- Utiliser l'approche client dans les interactions professionnelles."
      - "5- Réaliser un processus d'embauche."
    criteres_performance:
      - "1- Manifestation d'attitudes et de comportements démontrant une capacité d'écoute."
      - "2- Adaptation du niveau de langage selon la situation."
      - "3- Respect des règles de politesse et de courtoisie."
      - "4- Respect de l'approche client."
      - "5- Réalisation du processus de sélection pour un emploi ou un stage."
    contenu_essentiel: >-
      Connaissance de soi; impact de ses forces et faiblesses sur son
      processus de communication; écoute et communication bienveillante;
      processus d'embauche; parler en public; caractéristiques d'un
      communicateur compétent; communication non-verbale; approche client;
      satisfaction de la clientèle; fidélisation de la clientèle; attitudes
      professionnelles
  - code: 00SE-2
    titre: "Travailler au sein d'une équipe multidisciplinaire"
    duree_heures: 20
    habiletes:
      - "1- Reconnaître ses forces et ses faiblesses en matière de relations interpersonnelles."
      - "2- Reconnaître les défis associés au travail en équipe."
      - "3- Utiliser une stratégie générale de gestion des tâches."
      - "4- Distinguer les rôles et les responsabilités des membres de l'équipe."
      - "5- Reconnaître le rôle de la culture d'entreprise dans son travail de technicien."
      - "6- Manifester des comportements conformes à l'éthique professionnelle autant dans le travail que pour les relations avec les collègues."
      - "7- Gérer son stress en fonction des échéances et des demandes de l'employeur et/ou des clients."
      - "8- Reconnaître les facteurs susceptibles d'entraîner un épuisement professionnel."
    criteres_performance:
      - "1- Manifestation d'attitudes et de comportements de respect, d'ouverture d'esprit et de collaboration."
      - "2- Communication efficace avec les membres de l'équipe."
      - "3- Exécution correcte des tâches confiées."
      - "4- Respect des règles de fonctionnement en équipe."
      - "5- Respect de la culture d'entreprise."
      - "6- Démonstration de son esprit critique au regard des normes, des méthodes ou des bonnes pratiques en matière de développement d'applications et de gestion de réseaux."
      - "7- Respect des limites d'intervention professionnelle et de l'expertise des membres d'autres professions."
      - "8- Respect des échéances."
    contenu_essentiel: >-
      Les composantes d'un groupe nécessaires au fonctionnement optimal;
      l'écoute active et les types de mauvaise écoute; l'affirmation de
      soi; la communication non-violente (gestion des émotions négatives);
      la motivation des membres de l'équipe; la théorie de
      l'autodétermination; le groupe, ses caractéristiques, fonctions, son
      évolution et sa structure; le leadership; les prises de décision en
      groupe; les difficultés de communications; les conflits et leur
      résolution; la négociation et ouverture à la critique; évaluation de
      l'application de la solution et du résultat; reconnaître ses
      habiletés relatives à l'organisation; la division du travail et la
      répartition des rôles dans une équipe de travail; la tenue de
      réunions d'équipe efficaces; culture d'entreprise (cohérence,
      pérennité, vision, fonction sociale, codes de conduite); les
      attitudes professionnelles; le stress, l'anxiété et la performance;
      l'épuisement professionnel
  - code: 00SE-3
    titre: "Se situer au regard des obligations légales et des règles d'éthique professionnelle"
    duree_heures: 3
    habiletes:
      - "1- Distinguer le lien entre le niveau de développement moral d'une personne et les comportements éthiques en milieu de travail."
      - "2- Reconnaître l'influence des autres sur notre jugement et nos prises de décision."
      - "3- Reconnaître ce qu'est un acte criminel (plus précisément relatif à la cybercriminalité) et son lien avec la sécurité informatique."
      - "4- Reconnaître les conséquences et les risques de la cybercriminalité sur les entreprises."
      - "5- Faire preuve d'un sens éthique au regard de sa profession."
    criteres_performance:
      - "1 - Distinction juste des principaux délits et des principaux actes criminels dans le domaine informatique."
      - "2 - Distinction juste des principales atteintes à la propriété intellectuelle dans le domaine informatique."
      - "3 - Appréciation juste de conséquences de délits, d'actes criminels et d'atteintes à la propriété intellectuelle."
      - "4 - Détermination des mesures appropriées selon la situation."
      - "5 - Démonstration de son esprit critique au regard des lois, des codes d'éthique et des politiques d'entreprise."
    contenu_essentiel: >-
      Le développement moral (modèle de Piaget et modèle de Kohlberg);
      l'influence sociale et ses différentes formes; la résistance à
      l'influence; définition de la criminologie en lien avec la
      cybercriminalité
