competences:
  - code: 00SE
    titre: "Interagir dans un contexte professionnel"
    elements:
      - "1 - Établir des relations professionnelles avec des utilisatrices ou utilisateurs, ainsi que des clientes ou clients"
      - "2 - Travailler au sein d'une équipe multidisciplinaire"
      - "3 - Se situer au regard des obligations légales et des règles d'éthique professionnelle"

cible_formation: >-
  À la fin de ce cours, l'élève sera capable d'interagir dans des situations
  de travail variées.

notes_preliminaires: >-
  Le cours 350-6A3-VI : Interrelations professionnelles fait partie de la
  formation menant au diplôme d'études collégiales (DEC) dans le programme
  420.B0 : Techniques de l'informatique.


  Il est offert en 6e session.


  Ce cours vise l'atteinte complète de la compétence 00SE : Interagir dans
  un contexte professionnel.


  En quoi des habiletés de communication interpersonnelle et une formation
  en psychologie peuvent-elles être utiles dans une formation en
  informatique?


  À compétences techniques égales, les personnes qui ont de bonnes
  habiletés relationnelles ont de bien meilleures chances d'accéder au
  succès personnel et professionnel. La compétence Interagir dans un
  contexte professionnel permet à l'étudiant-e de marquer un temps d'arrêt
  et d'examiner son mode de relation avec les autres. Le cours permet
  d'identifier ses forces, ses faiblesses et d'apprendre quels sont les
  modèles proposés pour développer des relations personnelles et
  professionnelles efficaces et harmonieuses. Après avoir revu les
  fondements scientifiques de la psychologie de la communication et des
  organisations, les étudiant-e-s examinent plus précisément le fondement
  des rapports humains, le processus de sélection et ses biais, le travail
  d'équipe, le leadership et ses embûches, la modification du comportement
  ainsi que le concept d'attitude-client jusqu'à la relation d'aide, la
  communication, la gestion des conflits et la gestion des émotions.


  La nature et la diversité des tâches à accomplir font appel à de
  nombreuses habiletés interpersonnelles. Dans le cadre de son travail, la
  technicienne ou le technicien en informatique est appelé-e à expérimenter
  des relations interpersonnelles dans diverses situations de travail.


  Ce cours s'adresse aux étudiant-e-s en informatique qui seront appelé-e-s
  à communiquer verbalement avec différents types de personnes : des
  supérieurs dans le cadre de demandes d'information ou de présentation de
  projets, des collègues dans le cadre de travaux de groupe ou de réunions,
  et des clients-usagers lors d'entrevues d'analyse de besoins, de
  formation ou de présentation de produits ou de services. De plus, elle ou
  il pourra travailler au sein d'une équipe multidisciplinaire. Enfin, elle
  ou il devra satisfaire adéquatement les besoins de client-e-s.


  La technicienne ou le technicien en informatique doit apprendre à gérer
  le stress généré par les multiples situations interpersonnelles
  auxquelles elle ou il est confronté-e. Il doit posséder les habiletés
  d'expression orale qui vont lui permettre de s'adresser efficacement à
  divers intervenant-e-s. La nécessité de se mettre au diapason des
  nombreuses personnes avec lesquelles elle ou il interagit suppose de plus
  la présence d'une bonne capacité d'écoute. L'élève inscrit-e au cours
  doit, au terme de sa formation, pouvoir utiliser la reformulation de
  façon appropriée et savoir donner de la rétroaction constructive. Par
  ailleurs, les relations interpersonnelles qui font partie intégrante du
  travail de la technicienne ou du technicien en informatique vont à
  l'occasion donner lieu à des situations conflictuelles. Ainsi, la
  capacité d'appliquer adéquatement des techniques permettant la résolution
  de problèmes et la négociation s'avère un acquis indispensable. En plus
  des habiletés de communication identifiées plus avant, l'élève doit
  démontrer qu'elle ou il peut jouer un rôle actif dans un groupe, tout en
  manifestant des comportements conformes à l'éthique professionnelle dans
  l'exécution de ses tâches et dans ses relations avec ses collègues.


  Tout cela bien sûr, après avoir été retenu-e par l'entreprise, à la suite
  d'une entrevue de sélection. L'élève développera donc également
  l'habileté à bien se présenter en entretien d'embauche. Cela lui
  procurera les outils pour une recherche d'emploi future, et à plus brève
  échéance, pour obtenir son stage de fin de cursus.


  La compétence Interagir dans un contexte professionnel sera donc atteinte
  à travers ce cours de psychologie appliquée abordant la communication et
  les organisations. Les attitudes et compétences développées faciliteront
  l'intégration des étudiant-e-s sur le marché du travail et leur
  permettront d'établir des relations professionnelles satisfaisantes. Le
  but de ce cours est donc de fournir aux élèves des instruments permettant
  de s'adapter à diverses réalités humaines de leur profession, de mieux
  comprendre leurs interlocuteurs et surtout de mieux répondre à leurs
  besoins.


  (1) MA CARRIÈRE EN TECHNO, « Technicien en informatique », Ma carrière en
  techno, page consultée le 1 décembre 2021.

epreuve_finale:
  ponderation: "40 %"
  performance_finale_exigee: >-
    Analyser, de façon individuelle, des situations d'interaction et de
    communication dans des situations de travail variées.


    Dans diverses situations, l'élève devra porter un regard critique sur
    sa propre capacité à appliquer les concepts et stratégies relatives aux
    thèmes de la communication vus en classe. Par la suite, il devra
    réfléchir à des pistes d'amélioration souhaitables pour lui.
  contexte_realisation: >-
    Ces activités seront réalisées de façon individuelle dans un
    portfolio. Cette tâche sera réalisée en classe (lorsque le temps le
    permet) et hors classe et s'échelonnera de la semaine 12 à 15. Le
    portfolio devra être remis lors du cours de la semaine 15.
  criteres_evaluation:
    - Reconnaissance des éléments pertinents à l'analyse de la situation de communication.
    - Établissement de liens d'interprétation cohérents entre la théorie et les comportements identifiés dans la situation de communication.
    - Proposition des pistes d'amélioration concrètes et réalistes par rapport à sa façon de communiquer dans un contexte professionnel.
    - Utilisation appropriée du langage de la psychologie.

demarche_pedagogique_suggeree: >-
  La démarche pédagogique comprend des cours magistraux pour présenter les
  notions importantes, des ateliers, des études de cas, des rencontres avec
  des professionnels du milieu, des rapports écrits d'activités en équipe
  et des bilans personnels des attitudes mises en pratique. Puisque le
  contenu de cours le permet, il est préférable de se servir de situations
  qui reflètent bien la réalité du technicien en informatique pour traiter
  de notions théoriques.


  L'ensemble des heures en classe sera partagé de façon à : s'approprier
  les concepts relatifs à la communication interpersonnelle; s'habiliter à
  utiliser les diverses techniques de communication, dans des contextes
  variés, tout en portant un regard critique sur son processus de
  communication.


  Les activités en classe doivent privilégier au maximum l'établissement de
  liens entre les connaissances théoriques, l'expérience des autres et sa
  propre expérience afin de favoriser une compréhension et une intégration
  plus grande. On peut difficilement imaginer que les sujets de ce cours
  soient abordés uniquement sous un angle théorique. Il importe de
  compléter les connaissances avec l'expérience vécue qui ne manque pas
  dans ce domaine.


  Arrimage avec le cours "Projet intégrateur 2" : Les étudiant-e-s étant
  inscrits dans les deux cours en simultané, l'utilisation de ce projet
  authentique d'approche client est de mise pour mettre en pratique les
  habiletés interpersonnelles développées en classe. Le cours Projet
  intégrateur 2 permet aux étudiant-e-s d'expérimenter un réel contrat pour
  un-e réel-le client-e. Ce précieux partenariat entre les deux cours offre
  aux élèves la chance de vivre une expérience significative tout en étant
  accompagné-e-s par des enseignant-e-s aux champs d'expertise
  complémentaires : l'un-e au regard des aspects techniques de la
  programmation et l'autre par rapport aux habiletés professionnelles
  (travail d'équipe, gestion des conflits, approche client, etc.).


  Arrimage avec le dernier stage ATE : Nous travaillons ici en équipe pour
  la préparation au processus d'embauche. Bien que les étudiant-e-s aient
  déjà eu l'occasion de vivre deux expériences de stage pendant leur
  cursus, ce cours leur permet de parfaire leurs habiletés pour se préparer
  à un processus d'embauche en vivant une expérience d'entrevue simulée, en
  collaboration avec un-e autre enseignant-e du programme.

