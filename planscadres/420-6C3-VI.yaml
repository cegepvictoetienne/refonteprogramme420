competences:
  - code: "0000"
    titre: "Traiter l'information relative aux réalités du milieu du travail en informatique"
    elements:
      - "3 - Analyser l'information sur la profession de technicienne et technicien en informatique"
  - code: 00SH
    titre: "S'adapter à des technologies informatiques"
    elements:
      - "1 - Effectuer une veille technologique"
      - "2 - Expérimenter une technologie matérielle ou logicielle"
      - "3 - Formuler des avis sur la technologie"

cible_formation: >-
  À la fin du cours, l'élève sera en mesure de s'adapter à des technologies
  informatiques notamment en s'appropriant une facette non couverte d'une
  technologie étudiée dans les cours de sa formation.

notes_preliminaires: >-
  Le cours 420-6C3-VI : Projet personnel fait partie de la formation menant
  au diplôme d'études collégiales (DEC) dans le programme 420.B0 :
  Techniques de l'informatique.


  Il est offert en 6e session.


  Plusieurs compétences sont touchées par ce cours.


  L'atteinte de la compétence 0000 : Traiter l'information relative aux
  réalités du milieu du travail en informatique est complétée dans ce
  cours.


  Son acquisition a débuté dans les cours suivants : 420-1C4-VI : Outils
  informatiques à la 1re session (profil B0 : Profil par défaut); 420-5A3-VI
  : Technologies émergentes à la 5e session (profil B0 : Profil par défaut).


  L'atteinte de la compétence 00SH : S'adapter à des technologies
  informatiques est complétée dans ce cours.


  Son acquisition a débuté dans le cours 420-5A3-VI : Technologies
  émergentes à la 5e session.


  Ce cours est donné de façon intensive sur deux semaines après le dernier
  stage prévu à la séquence régulière.

epreuve_finale:
  ponderation: "100 %"
  performance_finale_exigee: >-
    L'élève produira un prototype fonctionnel d'une application qui utilise
    la technologie choisie.


    Le prototype sera accompagné d'un journal d'expérimentation qui indique
    notamment les problèmes rencontrés, les solutions proposées et le
    potentiel de la technologie.
  contexte_realisation: >-
    L'épreuve finale sera un travail long réalisé seul. Le développement du
    prototype se déroulera sur deux semaines pendant du temps en classe et
    hors classe.


    Le travail sera remis à la fin du jour 7 de 8.
  criteres_evaluation:
    - Installation correcte des applications ou des outils de développement nécessaires
    - Mise à l'essai adéquate de la technologie
    - Manifestation d'attitudes et de comportements démontrant l'autonomie et l'ouverture d'esprit
    - Justification adéquate du potentiel de la technologie
    - Notation claire des problèmes rencontrés et des solutions proposées

demarche_pedagogique_suggeree: >-
  L'autonomie de l'élève est la pierre angulaire de ce cours. L'enseignante
  ou l'enseignant jouera un rôle de chargé de projet.


  La coopération entre les élèves est encouragée.


  Les premières heures du premier cours seront consacrées à un tour de
  table formatif sur les expériences de stage des élèves concernés.


  Le cours sera agrémenté de plusieurs tours de table et discussions
  relatives aux expérimentations en cours.

mediagraphie:
  - "Information à venir"

materiel_requis: >-
  Ordinateur portable

elements_competence:
