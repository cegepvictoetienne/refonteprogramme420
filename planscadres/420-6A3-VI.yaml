competences:
  - code: 00SX
    titre: "Effectuer le développement d'applications pour des objets connectés"
    elements:
      - "1 - Analyser le projet de développement de l'application"
      - "2 - Préparer l'environnement de développement informatique et le banc d'essai"
      - "3 - Générer ou programmer l'interface utilisateur"
      - "4 - Programmer la logique applicative de l'objet et la logique applicative de contrôle ou de surveillance"
      - "5 - Contrôler la qualité de l'application"
      - "6 - Participer à la mise en service de l'application"
      - "7 - Rédiger la documentation"

cible_formation: >-
  À la fin du cours, l'élève sera en mesure d'effectuer le développement
  d'applications pour des objets connectés incluant le développement
  d'objets connectés personnalisés.

notes_preliminaires: >-
  Le cours 420-6A3-VI : Objets connectés 2 fait partie de la formation
  menant au diplôme d'études collégiales (DEC) dans le programme 420.B0 :
  Techniques de l'informatique.


  Il est offert en 6e session.


  L'atteinte de la compétence 00SX : Effectuer le développement
  d'applications pour des objets connectés est complétée dans ce cours.


  Son acquisition a débuté dans le cours 420-3A4-VI : Objets connectés 1 à
  la 3e session.


  Contrairement au cours Objets connectés 1, l'élève aura ici à développer
  ses propres objets connectés et sa propre boîte domotique.

epreuve_finale:
  ponderation: "50 %"
  performance_finale_exigee: >-
    L'épreuve finale consiste à poursuivre le développement d'une
    application pour des objets connectés en implémentant une
    fonctionnalité domotique sur une boîte domotique existante. À partir
    d'un devis, l'élève devra produire et livrer : l'objet à connecter
    correctement programmé; la programmation requise dans la boîte
    domotique.
  contexte_realisation: >-
    L'épreuve finale est réalisée de façon individuelle. Le développement
    du projet se déroulera sur 3 à 5 semaines à la fin de la session
    pendant du temps en classe et hors classe. La remise devra être faite
    à la semaine 15. Une démonstration du fonctionnement de l'objet
    connecté devra être faite à l'enseignant. L'épreuve finale devra être
    remise au tout dernier cours de la session.
  criteres_evaluation:
    - Position et fixation correctes de l'objet dans son environnement
    - Connexion correcte des objets à l'ordinateur de développement, au réseau ou à d'autres objets
    - Programmation correcte des instructions d'acquisition, de traitement et de transmission des données
    - Application rigoureuse des techniques de programmation sécurisée
    - Transfert correct de l'application sur l'objet connecté
    - Préparation appropriée de l'application en vue de son déploiement ou de son installation
    - Application rigoureuse des plans de tests

demarche_pedagogique_suggeree: >-
  Courtes périodes d'enseignement théorique suivies d'application au fur et
  à mesure à l'aide d'exercices formatifs. Des références de sites Web
  seront fournies par le professeur. L'élève devra enrichir ces sources
  d'information par ses propres recherches. Des activités seront proposées
  pour favoriser la coopération entre les élèves, l'échange des
  connaissances et la prise en charge de son apprentissage par l'élève.
  Certaines évaluations formatives peuvent être auto-corrigées par l'élève
  ou encore co-corrigées par un collègue de la classe. Bien que certains
  travaux ne fassent pas l'objet d'évaluation sommative, les élèves doivent
  absolument les compléter afin d'être prêts pour l'épreuve finale.

mediagraphie:
  - "Arduino — https://arduino.cc (Page consultée le 31 août 2021)"
  - "Raspberry Pi — https://www.raspberrypi.org (Page consultée le 31 août 2021)"
  - "Python — https://www.python.org (Page consultée le 31 août 2021)"

elements_competence:
  - code: 00SX-1
    titre: "Analyser le projet de développement de l'application"
    duree_heures: 2
    habiletes:
      - "Analyser les documents de conception"
      - "Déterminer les tâches à effectuer"
    criteres_performance:
      - "1 - Analyse juste des documents de conception"
      - "2 - Détermination correcte des tâches à effectuer"
    contenu_essentiel: >-
      Boîte domotique existante (ex : Jeedom, Home Assistant) vs boîte
      maison; objets connectés du commerce vs objets connectés personnalisés
  - code: 00SX-2
    titre: "Préparer l'environnement de développement informatique et le banc d'essai"
    duree_heures: 3
    habiletes:
      - "Installer le système d'exploitation sur l'unité centrale (ex : Raspberry Pi)"
      - "Installer et configurer l'environnement de développement"
      - "Monter un objet connecté personnalisé"
      - "Monter un banc d'essai (objets connectés dans un environnement d'essai)"
    criteres_performance:
      - "1 - Installation correcte des logiciels et des bibliothèques"
      - "2 - Position et fixation correctes des objets dans l'environnement de simulation"
      - "3 - Connexion correcte des objets à l'ordinateur de développement, au réseau ou à d'autres objets"
      - "4 - Mise à jour correcte des micrologiciels des objets"
      - "5 - Configuration appropriée du système de gestion de versions"
      - "6 - Importation correcte du code source"
    contenu_essentiel: >-
      Procédures d'installation et de mise à jour pour l'unité centrale, le
      logiciel de domotique et les objets connectés; cartes d'extension
      pour créer nos propres objets connectés (ex : carte Arduino, carte
      Z-Wave Z-Uno)
  - code: 00SX-3
    titre: "Générer ou programmer l'interface utilisateur"
    duree_heures: 10
    habiletes:
      - "Choisir et utiliser les éléments graphiques pour l'affichage et la saisie"
      - "Intégrer des images"
      - "Adapter l'interface en fonction du format d'affichage et de la résolution"
    criteres_performance:
      - "1 - Choix et utilisation appropriés des éléments graphiques pour l'affichage et la saisie"
      - "2 - Intégration correcte des images"
      - "3 - Adaptation de l'interface en fonction du format d'affichage et de la résolution"
    contenu_essentiel: >-
      Programmation en fonction des possibilités et contraintes des
      technologies utilisées
  - code: 00SX-4
    titre: "Programmer la logique applicative de l'objet et la logique applicative de contrôle ou de surveillance"
    duree_heures: 20
    habiletes:
      - "Programmer dans le langage choisi selon le contexte domotique"
      - "Programmer la logique applicative d'un objet connecté personnalisé"
      - "Programmer la logique applicative de contrôle ou de surveillance"
    criteres_performance:
      - "1 - Programmation correcte des instructions d'acquisition, de traitement et de transmission des données"
      - "2 - Programmation correcte des interactions entre l'interface et l'utilisatrice ou l'utilisateur"
      - "3 - Utilisation appropriée des services d'échange de données"
      - "4 - Application correcte des techniques d'internationalisation"
      - "5 - Application rigoureuse des techniques de programmation sécurisée"
      - "6 - Transfert correct de l'application sur l'objet connecté"
      - "7 - Respect des contraintes temporelles"
    contenu_essentiel: >-
      Instructions spécialisées pour la domotique
  - code: 00SX-5
    titre: "Contrôler la qualité de l'application"
    duree_heures: 5
    habiletes:
      - "Effectuer des tests fonctionnels"
      - "Effectuer une revue de code"
      - "Effectuer une revue de sécurité"
    criteres_performance:
      - "1 - Application rigoureuse des plans de tests"
      - "2 - Revues de code et de sécurité rigoureuses"
      - "3 - Pertinence des correctifs"
      - "4 - Respect des procédures de suivi des problèmes et de gestion des versions"
      - "5 - Respect des documents de conception"
    contenu_essentiel: >-
      Tests fonctionnels; revue de code; revue de sécurité
  - code: 00SX-6
    titre: "Participer à la mise en service de l'application"
    duree_heures: 3
    habiletes:
      - "Rendre l'application disponible à distance"
      - "Appliquer les précautions requises lors de l'installation des objets connectés dans un environnement réel"
    criteres_performance:
      - "1 - Préparation appropriée de l'application en vue de son déploiement ou de son installation"
      - "2 - Déploiement ou installation corrects de l'application"
      - "3 - Exécution correcte des tests préopérationnels"
      - "4 - Pertinence de l'information transmise aux utilisatrices ou utilisateurs sur le fonctionnement et la sécurité de l'application"
    contenu_essentiel: >-
      Précautions à considérer lors de l'installation des objets connectés
      dans un environnement réel; notions de réseautique pour rendre
      l'application disponible à distance
  - code: 00SX-7
    titre: "Rédiger la documentation"
    duree_heures: 2
    habiletes:
      - "Rédiger un document de suivi du travail effectué"
      - "Rédiger un manuel de l'utilisateur"
    criteres_performance:
      - "1 - Détermination correcte de l'information à rédiger"
      - "2 - Notation claire du travail effectué"
    contenu_essentiel: >-
      Fichier de révision dans Git (à utiliser avec git commit -F); manuel
      de l'utilisateur
