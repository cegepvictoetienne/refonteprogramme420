cible_formation: >-
  À la fin du cours, l'élève sera capable de sélectionner et d'exploiter un
  système de gestion de bases de données non relationnel (NoSQL) en
  fonction du contexte de réalisation d'un projet de mégadonnées.

notes_preliminaires: >-
  Le cours 420-4C4-VI : Mégadonnées fait partie de la formation menant au
  diplôme d'études collégiales (DEC) dans le programme 420.B0 : Techniques
  de l'informatique.


  Il est offert en 4e session.


  L'atteinte de la compétence 00Q7 : Exploiter un système de gestion de
  base de données est complétée dans ce cours.


  Son acquisition a débuté dans les cours suivants : 420-2B4-VI : Bases de
  données 1 à la 2e session (profil B0 : Profil par défaut); 420-3B4-VI :
  Bases de données 2 à la 3e session (profil B0 : Profil par défaut).


  Le cours a pour but d'approfondir un système de gestion de bases de
  données (SGBD) non relationnelles (NoSQL). Il a aussi comme objectif de
  comprendre les différences entre les structures de bases de données non
  relationnelles. Un minimum de 2 SGBD NoSQL de types différents (document,
  clé-valeur, colonnes, graphe, etc.) doivent être intégrés à la formation.

epreuve_finale:
  ponderation: "50 %"
  performance_finale_exigee: >-
    L'épreuve finale consiste à concevoir une base de données et effectuer
    les traitements en respectant les critères donnés en classe. À partir
    d'une mise en situation l'élève devra : sélectionner le système de
    gestion de base de données approprié; concevoir le modèle de données;
    transformer et acquérir ou importer les données dans le modèle;
    assurer la confidentialité et la cohérence des données; déterminer les
    requêtes à effectuer; optimiser la base de données; programmer les
    traitements d'analyse des données.
  contexte_realisation: >-
    Projet individuel réalisé en classe et hors classe pendant les trois
    dernières semaines de la session. Pour la semaine 15, l'élève doit
    planifier une rencontre individuelle d'une durée de 30 minutes pour
    présenter son projet. Lors de cette rencontre, l'élève présente les
    forces et les faiblesses de la base de données conçue et des
    traitements proposés, en s'appuyant sur les acquis effectués tout au
    long de la session. Un élève participant à un séjour pédagogique doit
    planifier cette rencontre dans les 5 jours ouvrables suivant la date de
    retour. Lors de sa présentation, l'élève doit en plus établir un
    minimum de 2 liens entre son projet et les discussions entretenues
    avec les partenaires rencontrés pendant le séjour.
  criteres_evaluation:
    - Sélection appropriée du SGBD
    - Conception et création juste de la base de données
    - Détermination judicieuse des types de requêtes à formuler
    - Utilisation appropriée des clauses, des opérateurs, des commandes ou des paramètres
    - Utilisation appropriée des expressions régulières
    - Fonctionnement correct des requêtes
    - Détermination judicieuse des techniques à utiliser
    - Gestion correcte des autorisations
    - Cryptage approprié des données
    - Détermination judicieuse des traitements de données à automatiser
    - Documentation précise, bien présentée et contenant tous les éléments demandés
    - Choix judicieux des techniques de sauvegarde et de restauration à utiliser
    - Utilisation appropriée de techniques de sauvegarde et de restauration de la base de données

demarche_pedagogique_suggeree: >-
  Le choix des deux SGBD à mettre au plan de cours pour ce cours devra
  faire l'objet d'une discussion départementale au début de chaque
  session. Il est suggéré d'arrimer les notions d'acquisition, de
  traitement et d'analyse des données massives aux notions statistiques
  qui en découlent (regroupement, fonctions statistiques, calcul de marge
  d'erreur et traitements automatisés) et répondent aux besoins émergeant
  dans notre société. En ce sens, les notions ciblées sauront être
  réinvesties dans des activités pédagogiques portant abondamment, mais
  non exclusivement, sur le traitement des données massives issues, autant
  que faire se peut, de besoins réels de notre communauté. L'arrimage
  souhaité des activités pédagogiques des cours Big Data et Géométrie et
  Statistiques saura mettre en valeur la couleur geek propre à la
  formation du programme. Courtes périodes d'enseignement théorique
  suivies d'application au fur et à mesure à l'aide d'exercices formatifs.
  Des références de sites Web seront fournies par le professeur. L'élève
  devra enrichir ces sources d'information par ses propres recherches. Des
  activités seront proposées pour favoriser la coopération entre les
  élèves, l'échange des connaissances et la prise en charge de son
  apprentissage par l'élève. Certaines évaluations formatives peuvent être
  auto-corrigées par l'élève ou encore co-corrigées par un collègue de la
  classe. Bien que certains travaux ne fassent pas l'objet d'évaluation
  sommative, les élèves doivent absolument les compléter afin d'être prêts
  pour l'épreuve finale.

