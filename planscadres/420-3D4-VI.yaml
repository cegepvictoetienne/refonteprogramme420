  - code: 00Q5-4
    titre: "Installer des services de partage de ressources"
    duree_heures: 45
    habiletes:
      - "Appliquer la procédure d'installation de services"
      - "Configurer les services"
      - "Journaliser les configurations"
    criteres_performance:
      - "1 - Application rigoureuse de la procédure d'installation des services"
      - "2 - Configuration correcte des services"
      - "3 - Notation claire des configurations effectuées"
    contenu_essentiel: >-
      Services : Active Directory,  Microsoft Entra ID, Azure Backup;
      Gestion de VM Azure pour déploiement de services divers 
  - code: 00Q5-5
    titre: "Mettre en service le réseau local"
    duree_heures: 15
    habiletes:
      - "Appliquer des plans de tests"
      - "Effectuer des correctifs"
      - "Optimiser le fonctionnement du réseau"
    criteres_performance:
      - "1 - Application rigoureuse des plans de tests"
      - "2 - Pertinence des correctifs"
      - "3 - Fonctionnement optimal du réseau"
    contenu_essentiel: >-
      Azure Networking; 
